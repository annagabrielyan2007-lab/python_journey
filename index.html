<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        main {
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <header>
       <h1>Anna's Store Dashboard</h1>
    </header>

    <main>
        <div class="card">
            <h2>Welcome, Admin!</h2>
            <p>This is your front-end user interface connected to your store management system.</p>
            <button onclick="alert('System Connected!')">Click to Test</button>
        </div>
    </main>

</body>
</html>
